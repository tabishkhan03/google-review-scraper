version: '3.8'

services:
  app:
    build: .
    container_name: google-review-scraper
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/google-reviews
      - CACHE_TTL_HOURS=6
    volumes:
      - ./.env:/usr/src/app/.env
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: google-review-scraper-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data: 